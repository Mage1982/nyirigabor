<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nyirigabor.hu — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient-start: #060b19;
            --bg-gradient-mid: #0a192f;
            --bg-gradient-end: #020c1b;
            --accent-glow: #1e3a8a;
            --cyan-glow: #38bdf8;
            --text-white: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #060b19;
            color: var(--text-white);
        }

        /* Háttér animált canvas és gradiens */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 40%, #0d254c 0%, #060b19 70%, #020611 100%);
            z-index: 1;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Fénygömb aura effektek */
        .glow-orb {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(30, 58, 138, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
        }

        /* Fő tartalom tároló */
        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        /* Üveghatású kártya hordozó */
        .hero-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 60px 80px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 900px;
            width: 90%;
            animation: cardFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Főcím: nyirigabor.hu */
        .title {
            font-size: clamp(3.2rem, 8vw, 6.5rem);
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.03em;
            line-height: 1.05;
            margin-bottom: 12px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: linear-gradient(180deg, #ffffff 30%, rgba(255, 255, 255, 0.75) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Elválasztó animált csík */
        .divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            margin: 20px auto 28px auto;
            border-radius: 2px;
            animation: expandDivider 1.5s ease-out forwards;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        @keyframes expandDivider {
            from { width: 0px; opacity: 0; }
            to { width: 100px; opacity: 1; }
        }

        /* Alcím: Coming Soon... */
        .subtitle {
            font-size: clamp(1.4rem, 4vw, 2.5rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin-bottom: 0;
            min-height: 1.3em;
        }

        /* Villogó kurzor a gépelős effektnek */
        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #38bdf8;
            margin-left: 4px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Status jelző badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: #38bdf8;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: statusPulse 2s infinite;
        }

        @keyframes statusPulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        /* Mobil nézet finomhangolás */
        @media (max-width: 600px) {
            .hero-card {
                padding: 40px 24px;
            }
            .divider {
                margin: 16px auto 20px auto;
            }
        }
    </style>
</head>
<body>

    <div class="background-container">
        <div class="glow-orb"></div>
        <canvas id="particle-canvas"></canvas>
    </div>

    <main class="content-container">
        <div class="hero-card">
            <div class="badge">
                <span class="status-dot"></span> Hamarosan érkezik
            </div>
            <h1 class="title">nyirigabor.hu</h1>
            <div class="divider"></div>
            <p class="subtitle"><span id="typed-text"></span><span class="cursor">&nbsp;</span></p>
        </div>
    </main>

    <script>
        // --- 1. Gépelő (Typewriter) Animáció a "Coming Soon..." szöveghez ---
        const textToType = "Coming Soon...";
        const typedTextElement = document.getElementById("typed-text");
        let charIndex = 0;

        function typeEffect() {
            if (charIndex < textToType.length) {
                typedTextElement.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeEffect, 120);
            }
        }

        // Indítás kis késleltetéssel a kártya beúszása után
        setTimeout(typeEffect, 600);


        // --- 2. Finom háttér részecske (Particle) animáció Canvas-szel ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        const numberOfParticles = 45;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }

            draw() {
                ctx.fillStyle = `rgba(186, 230, 253, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
