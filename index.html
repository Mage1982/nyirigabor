    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #02040a;
            color: #ffffff;
        }

        /* Canvas háttér tároló */
        #sky-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Fő tartalom tároló */
        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        /* Üveghatású kártya hordozó */
        .hero-card {
            background: rgba(8, 15, 30, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 60px 80px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            max-width: 900px;
            width: 90%;
            animation: cardFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Főcím */
        .title {
            font-size: clamp(2.8rem, 7vw, 5.8rem);
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 8px;
            padding: 4px 10px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
        }

        /* Elválasztó animált csík */
        .divider {
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            margin: 20px auto 28px auto;
            border-radius: 2px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.7);
        }

        /* Alcím box */
        .subtitle-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .subtitle-sub {
            font-size: clamp(1.1rem, 3vw, 2.2rem);
            font-weight: 300;
            color: rgba(224, 242, 254, 0.95);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            min-height: 1.3em;
        }

        /* Villogó kurzor a gépelős effektnek */
        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #38bdf8;
            margin-left: 4px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Status jelző badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: statusPulse 2s infinite;
        }

        @keyframes statusPulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        @media (max-width: 600px) {
            .hero-card { padding: 40px 20px; }
            .title { white-space: normal; word-break: break-word; }
        }

<body>

    <canvas id="sky-canvas"></canvas>

    <main class="content-container">
        <div class="hero-card">
            <div class="badge">
                <span class="status-dot"></span> Hamarosan érkezik
            </div>
            <h1 class="title">nyirigabor.hu</h1>
            <div class="divider"></div>
            <div class="subtitle-box">
                <div class="subtitle-sub"><span id="typed-text"></span><span class="cursor">&nbsp;</span></div>
            </div>
        </div>
    </main>

    <script>
        // --- 1. Gépelő effektus ---
        const textToType = "Coming Soon...";
        const typedTextElement = document.getElementById("typed-text");
        let charIndex = 0;

        function typeEffect() {
            if (charIndex < textToType.length) {
                typedTextElement.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeEffect, 120);
            }
        }
        setTimeout(typeEffect, 600);

        // --- 2. Telihold és éjszakai égbolt Canvas animáció ---
        const canvas = document.getElementById('sky-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.floor((width * height) / 3000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.3,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005
                });
            }
        }

        window.addEventListener('resize', resize);
        resize();

        let pulseAngle = 0;

        function drawSky() {
            // Éjszakai égbolt gradiens
            const skyGradient = ctx.createRadialGradient(
                width * 0.5, height * 0.35, 50,
                width * 0.5, height * 0.35, width * 0.9
            );
            skyGradient.addColorStop(0, '#0f172a');
            skyGradient.addColorStop(0.5, '#070d19');
            skyGradient.addColorStop(1, '#02040a');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            // Csillagok rajzolása és pislákolása
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0.2) s.speed *= -1;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Telihold pozíciója
            const moonX = width * 0.5;
            const moonY = height * 0.35;
            const moonRadius = Math.min(width, height) * 0.12;

            pulseAngle += 0.015;
            const glowPulse = Math.sin(pulseAngle) * 15;

            // Hold külső ragyogása (Aura)
            const outerGlow = ctx.createRadialGradient(
                moonX, moonY, moonRadius * 0.8,
                moonX, moonY, moonRadius * 3 + glowPulse
            );
            outerGlow.addColorStop(0, 'rgba(224, 242, 254, 0.45)');
            outerGlow.addColorStop(0.3, 'rgba(186, 230, 253, 0.15)');
            outerGlow.addColorStop(1, 'rgba(14, 165, 233, 0)');
            ctx.fillStyle = outerGlow;
            ctx.beginPath();
            ctx.arc(moonX, moonY, moonRadius * 3 + glowPulse, 0, Math.PI * 2);
            ctx.fill();

            // Telihold teste
            const moonBody = ctx.createRadialGradient(
                moonX - moonRadius * 0.3, moonY - moonRadius * 0.3, moonRadius * 0.1,
                moonX, moonY, moonRadius
            );
            moonBody.addColorStop(0, '#ffffff');
            moonBody.addColorStop(0.75, '#f0f9ff');
            moonBody.addColorStop(1, '#e0f2fe');

            ctx.fillStyle = moonBody;
            ctx.beginPath();
            ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
            ctx.shadowColor = 'rgba(224, 242, 254, 0.9)';
            ctx.shadowBlur = 40;
            ctx.fill();
            ctx.shadowBlur = 0; // shadow reset

            // Hold kráterek / felszíni textúra
            ctx.fillStyle = 'rgba(186, 230, 253, 0.18)';
            const craters = [
                { x: -0.2, y: -0.1, r: 0.22 },
                { x: 0.25, y: 0.2, r: 0.18 },
                { x: -0.1, y: 0.35, r: 0.15 },
                { x: 0.3, y: -0.25, r: 0.12 },
                { x: 0.05, y: -0.3, r: 0.09 }
            ];

            craters.forEach(c => {
                ctx.beginPath();
                ctx.arc(
                    moonX + c.x * moonRadius,
                    moonY + c.y * moonRadius,
                    c.r * moonRadius,
                    0, Math.PI * 2
                );
                ctx.fill();
            });

            requestAnimationFrame(drawSky);
        }

        drawSky();
    </script>
</body>
