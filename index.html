<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nyirigabor.hu — Coming Soon</title>

    <!-- Favicon beállítása -->
    <link rel="icon" type="image/jpeg" href="Gemini_Generated_Image_99u44s99u44s99u4.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="Gemini_Generated_Image_99u44s99u44s99u4.jpg">
    <link rel="apple-touch-icon" href="Gemini_Generated_Image_99u44s99u44s99u4.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030712;
            --cyan-glow: #38bdf8;
            --blue-glow: #2563eb;
            --purple-glow: #4f46e5;
            --text-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-white);
        }

        /* Lassan animált, dinamikus gradiens háttér */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #020617 0%, #0b192c 30%, #041226 60%, #020617 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            z-index: 1;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Hirtelen villanások (Lightning / Flash) réteg */
        .flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.4) 0%, rgba(37, 99, 235, 0.15) 50%, transparent 80%);
            opacity: 0;
            pointer-events: none;
            z-index: 2;
            animation: randomFlicker 7s infinite;
        }

        @keyframes randomFlicker {
            0%, 89%, 93%, 97%, 100% { opacity: 0; transform: scale(1); }
            90% { opacity: 0.85; transform: scale(1.05); filter: brightness(1.8); }
            92% { opacity: 0.1; }
            94% { opacity: 0.95; transform: scale(1.02); filter: brightness(2.2); }
            95% { opacity: 0.3; }
            96% { opacity: 0.7; }
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* Fénygömb aura effektek - lassú pulzálás */
        .glow-orb {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, rgba(30, 58, 138, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            animation: pulseGlow 12s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(1.25); opacity: 0.85; }
        }

        /* Fő tartalom tároló */
        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        /* Üveghatású kártya hordozó */
        .hero-card {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 60px 80px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            max-width: 900px;
            width: 90%;
            animation: cardFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Főcím */
        .title {
            font-size: clamp(2.8rem, 7vw, 5.8rem);
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 8px;
            padding: 4px 10px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
        }

        /* Elválasztó animált csík */
        .divider {
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            margin: 20px auto 28px auto;
            border-radius: 2px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.7);
        }

        /* Alcím box */
        .subtitle-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .subtitle-sub {
            font-size: clamp(1.1rem, 3vw, 2.2rem);
            font-weight: 300;
            color: rgba(56, 189, 248, 0.9);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            min-height: 1.3em;
        }

        /* Villogó kurzor a gépelős effektnek */
        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #38bdf8;
            margin-left: 4px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Status jelző badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: statusPulse 2s infinite;
        }

        @keyframes statusPulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        /* Mobil nézet finomhangolás */
        @media (max-width: 600px) {
            .hero-card {
                padding: 40px 20px;
            }
            .title {
                white-space: normal;
                word-break: break-word;
            }
        }
    </style>
</head>
<body>

    <div class="background-container">
        <div class="flash-overlay"></div>
        <div class="glow-orb"></div>
        <canvas id="particle-canvas"></canvas>
    </div>

    <main class="content-container">
        <div class="hero-card">
            <div class="badge">
                <span class="status-dot"></span> Hamarosan érkezik
            </div>
            <h1 class="title">nyirigabor.hu</h1>
            <div class="divider"></div>
            <div class="subtitle-box">
                <div class="subtitle-sub"><span id="typed-text"></span><span class="cursor">&nbsp;</span></div>
            </div>
        </div>
    </main>

    <script>
        // 1. Gépelő (Typewriter) Animáció a "Coming Soon..." szöveghez
        const textToType = "Coming Soon...";
        const typedTextElement = document.getElementById("typed-text");
        let charIndex = 0;

        function typeEffect() {
            if (charIndex < textToType.length) {
                typedTextElement.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeEffect, 120);
            }
        }

        setTimeout(typeEffect, 600);

        // 2. Háttér részecske animáció Canvas-szel
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        const numberOfParticles = 50;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }

            draw() {
                ctx.fillStyle = `rgba(186, 230, 253, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
