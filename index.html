<!DOCTYPE html>
<html lang="hu" class="h-full bg-[#090b10]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAgent.ai | Nyíri Gábor - AI Kísérleti Laboratórium</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Orbitron, Share Tech Mono & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        magenta: '#FF0C9D',
                        cyan: '#00FFFF',
                        purpleGlow: '#8A2BE2',
                        darkBg: '#090b10',
                        cardBg: 'rgba(15, 20, 32, 0.65)'
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 3s infinite alternate',
                        'grid-move': 'gridMove 20s linear infinite',
                        'float': 'float 4s ease-in-out infinite',
                        'scanline': 'scanline 6s linear infinite'
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%': { filter: 'drop-shadow(0 0 12px rgba(255, 12, 157, 0.4))' },
                            '100%': { filter: 'drop-shadow(0 0 25px rgba(0, 255, 255, 0.6))' }
                        },
                        gridMove: {
                            '0%': { transform: 'translateY(0)' },
                            '100%': { transform: 'translateY(40px)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-6px)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Cyber Grid Overlay Background */
        .bg-cyber-grid {
            background-image: 
                linear-gradient(to right, rgba(0, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 12, 157, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Glassmorphism Card Effect */
        .glass-card {
            background: rgba(15, 20, 32, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 255, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .glass-card:hover {
            border-color: rgba(0, 255, 255, 0.7);
            box-shadow: 0 10px 35px -5px rgba(0, 255, 255, 0.35), inset 0 0 20px rgba(0, 255, 255, 0.1);
            transform: translateY(-8px);
        }

        .glass-card-magenta:hover {
            border-color: rgba(255, 12, 157, 0.8);
            box-shadow: 0 10px 35px -5px rgba(255, 12, 157, 0.4), inset 0 0 20px rgba(255, 12, 157, 0.1);
        }

        /* Neon Gradient Text */
        .neon-text-gradient {
            background: linear-gradient(135deg, #00FFFF 0%, #FFFFFF 50%, #FF0C9D 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Interactive Cursor Spotlight */
        #interactive-glow {
            pointer-events: none;
            background: radial-gradient(650px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(0, 255, 255, 0.08), rgba(255, 12, 157, 0.05), transparent 70%);
        }
    </style>
</head>

                    <i class="fa-solid fa-globe text
