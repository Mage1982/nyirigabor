    <style>
        :root {
            --bg-black: #030712;
            --card-bg: rgba(11, 19, 38, 0.65);
            --border-glow: rgba(56, 189, 248, 0.2);
            --primary-blue: #38bdf8;
            --accent-cyan: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-black);
            color: var(--text-main);
        }

        /* Sötétkék - Fekete elegáns, lassan pulzáló háttér */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, #0a1738 0%, #030712 70%, #000000 100%);
            z-index: 1;
        }

        .glow-orb {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 2;
            animation: orbPulse 10s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes orbPulse {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.25); opacity: 0.9; }
        }

        /* Layout Container */
        .main-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* Glassmorphism Névjegykártya */
        .vcard-container {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glow);
            border-radius: 28px;
            padding: 52px 48px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Profil / Fejléc */
        .profile-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            background: linear-gradient(135deg, #0284c7 0%, #030712 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--primary-blue);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
        }

        .name {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .domain-tag {
            font-size: 0.9rem;
            color: var(--primary-blue);
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 32px;
            opacity: 0.9;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            margin-bottom: 32px;
        }

        /* Elérhetőség Gombok (Links) */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .contact-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .contact-card:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-blue);
            flex-shrink: 0;
            transition: background 0.3s ease;
        }

        .contact-card:hover .icon-box {
            background: var(--primary-blue);
            color: var(--bg-black);
        }

        .contact-info {
            text-align: left;
            overflow: hidden;
        }

        .contact-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 2px;
            font-weight: 600;
        }

        .contact-value {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        /* Lábléc */
        .footer-note {
            margin-top: 36px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        @media (max-width: 480px) {
            .vcard-container {
                padding: 40px 24px;
            }
            .name {
                font-size: 1.8rem;
            }
            .contact-value {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
