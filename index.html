<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliratkozás - Nyíri Gábor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --error-color: #f87171;
            --success-color: #4ade80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        p.description {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .message.success {
            color: var(--success-color);
            display: block;
        }

        .message.error {
            color: var(--error-color);
            display: block;
        }

        .redirect-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .redirect-btn:hover {
            background-color: var(--accent-color);
            color: #0f172a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Iratkozz fel!</h1>
        <p class="description">Add meg az adataidat, és azonnal rögzítjük a feliratkozásodat.</p>

        <form id="subscribeForm">
            <div class="form-group">
                <label for="name">Név</label>
                <input type="text" id="name" name="name" placeholder="Gábor" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail cím</label>
                <input type="email" id="email" name="email" placeholder="pelda@email.hu" required>
            </div>

            <button type="submit" id="submitBtn">Feliratkozás</button>
        </form>

        <div id="statusMessage" class="message"></div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxGe6IZSur8CnE8f0eFVq7JNJbrJAyqXFqRAP7sH4AAJGmsOaAwueMjyJ1USSpkjwNJzw/exec';
        const redirectURL = 'koszonjuk.html'; // Ide irányít át sikeres küldés után

        const form = document.getElementById('subscribeForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Gomb zárolása és visszajelzés
            submitBtn.disabled = true;
            submitBtn.innerText = 'Küldés...';
            statusMessage.className = 'message';
            statusMessage.innerHTML = '';

            const nameValue = document.getElementById('name').value;
            const emailValue = document.getElementById('email').value;

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    name: nameValue,
                    email: emailValue
                })
            })
            .then(() => {
                statusMessage.innerHTML = `
                    Köszönjük! A feliratkozásod sikeresen rögzítettük.<br>
                    <small>Pillanaton belül átirányítunk...</small><br>
                    <a href="${redirectURL}" class="redirect-btn">Tovább a köszönőoldalra</a>
                `;
                statusMessage.className = 'message success';
                form.reset();

                // 2.5 másodperc múlva automatikus átirányítás
                setTimeout(() => {
                    window.location.href = redirectURL;
                }, 2500);
            })
            .catch(error => {
                console.error('Hiba:', error);
                statusMessage.innerText = 'Hiba történt a küldés során. Kérjük, próbáld újra!';
                statusMessage.className = 'message error';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Feliratkozás';
            });
        });
    </script>

</body>
</html>
