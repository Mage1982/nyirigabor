<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEXUS v3.0 - Quantum Audio Visualizer</title>
    <!-- Tailwind CSS a letisztult elrendezéshez és modern UI elemekhez -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #05060f;
            --panel-bg: rgba(13, 16, 30, 0.75);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text-main: #f0f4f8;
            --text-muted: #94a3b8;
            --accent-primary: #00ffff;
            --accent-secondary: #ff0c9d;
        }

        /* Világos téma beállítások */
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --panel-border: rgba(0, 0, 0, 0.12);
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        /* UV Neon Színpaletta Témák */
        [data-uv="cyan"] {
            --accent-primary: #00ffff;
            --accent-secondary: #ff0c9d;
        }
        [data-uv="ultraviolet"] {
            --accent-primary: #9d00ff;
            --accent-secondary: #ff00ea;
        }
        [data-uv="lime"] {
            --accent-primary: #39ff14;
            --accent-secondary: #00ffff;
        }
        [data-uv="solar"] {
            --accent-primary: #ffaa00;
            --accent-secondary: #ff2200;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .custom-slider {
            accent-color: var(--accent-primary);
        }

        .btn-neon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-neon:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-primary);
        }

        .btn-neon.active {
            background: var(--accent-primary);
            color: #000;
            font-weight: 700;
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-primary);
        }
    </style>
</head>
<body class="relative w-full h-full select-none">

    <!-- Canvas hátterű interaktív részecske háló -->
    <canvas id="nexusCanvas" class="absolute inset-0 z-0"></canvas>

    <!-- Fejléc (Bal felső sarok) -->
    <header class="absolute top-4 left-4 z-10 glass-panel rounded-2xl px-5 py-3 flex items-center gap-3">
        <div class="w-3 h-3 rounded-full animate-ping" style="background-color: var(--accent-primary);"></div>
        <h1 class="font-bold text-lg tracking-wider uppercase bg-clip-text text-transparent bg-gradient-to-r from-[var(--accent-primary)] to-[var(--accent-secondary)]">
            NEXUS <span class="text-xs px-2 py-0.5 rounded border border-[var(--accent-primary)] text-[var(--accent-primary)] font-mono ml-1">v3.0</span>
        </h1>
    </header>

    <!-- Vezérlő Panel (Jobb felső / Középső testreszabás) -->
    <div class="absolute top-4 right-4 z-10 glass-panel rounded-2xl p-4 w-80 flex flex-col gap-4 text-xs">
        <div>
            <label class="block font-semibold mb-1 text-[var(--text-muted)]">MOZGÁSI MÓD</label>
            <div class="grid grid-cols-2 gap-1.5">
                <button class="btn-neon py-1.5 px-2 rounded-lg text-left font-medium active" id="modeStationary" onclick="setMovementMode('stationary')">📍 Stacionárius</button>
                <button class="btn-neon py-1.5 px-2 rounded-lg text-left font-medium" id="modeDrift" onclick="setMovementMode('drift')">🌌 Drift</button>
                <button class="btn-neon py-1.5 px-2 rounded-lg text-left font-medium" id="modeWave" onclick="setMovementMode('wave')">🌊 Wave</button>
                <button class="btn-neon py-1.5 px-2 rounded-lg text-left font-medium" id="modeChaos" onclick="setMovementMode('chaos')">⚡ Chaos</button>
            </div>
        </div>

        <div>
            <div class="flex justify-between items-center mb-1">
                <label class="font-semibold text-[var(--text-muted)]">SEBESSÉG / RUGALMASSÁG</label>
                <span id="speedValue" class="font-mono text-[var(--accent-primary)]">1.5x</span>
            </div>
            <input type="range" id="speedSlider" min="0.2" max="4.0" step="0.1" value="1.5" class="w-full custom-slider cursor-pointer">
        </div>

        <div>
            <label class="block font-semibold mb-1 text-[var(--text-muted)]">UV / NEON PALETTA</label>
            <div class="grid grid-cols-4 gap-1.5">
                <button onclick="setUvPalette('cyan')" class="h-6 rounded-md bg-gradient-to-r from-cyan-400 to-pink-500 border border-white/20 hover:scale-105 transition-transform" title="Cyber Neon"></button>
                <button onclick="setUvPalette('ultraviolet')" class="h-6 rounded-md bg-gradient-to-r from-purple-600 to-pink-500 border border-white/20 hover:scale-105 transition-transform" title="Ultra Violet"></button>
                <button onclick="setUvPalette('lime')" class="h-6 rounded-md bg-gradient-to-r from-lime-400 to-cyan-400 border border-white/20 hover:scale-105 transition-transform" title="Electric Lime"></button>
                <button onclick="setUvPalette('solar')" class="h-6 rounded-md bg-gradient-to-r from-amber-400 to-red-600 border border-white/20 hover:scale-105 transition-transform" title="Solar Flare"></button>
            </div>
        </div>
    </div>

    <!-- Alsó Vezérlősáv (Középen alul) -->
    <div class="absolute bottom-5 left-1/2 -translate-x-1/2 z-10 glass-panel rounded-2xl p-2 flex items-center gap-2">
        <button id="audioToggleBtn" class="btn-neon px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2">
            <span id="audioIcon">🔇</span>
            <span id="audioText">Audio Synth: Ki</span>
        </button>
        <button id="supportBtn" class="btn-neon px-4 py-2 rounded-xl text-sm font-semibold">
            ☕ Támogatás
        </button>
    </div>

    <!-- Jobb Alsó Sarok: Téma Váltó (Sötét / Világos) -->
    <button id="themeToggleBtn" class="absolute bottom-5 right-5 z-20 glass-panel p-3.5 rounded-full btn-neon flex items-center justify-center text-xl shadow-lg" title="Téma Váltása (Sötét/Világos)">
        <span id="themeIcon">🌙</span>
    </button>

    <!-- Support Modal -->
    <div id="supportModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-panel p-6 rounded-3xl max-w-sm w-full mx-4 text-center flex flex-col items-center gap-4">
            <h2 class="text-xl font-bold text-[var(--accent-primary)]">Nexus v3.0 Support</h2>
            <p class="text-xs text-[var(--text-muted)] leading-relaxed">
                Köszönöm, hogy használod a Nexus interaktív audio-vizuális szintetizátort! Ha elnyerte tetszésedet a kísérleti projekt, támogathatod a fejlesztést.
            </p>
            <button onclick="window.open('https://paypal.me', '_blank')" class="btn-neon w-full py-2.5 rounded-xl font-bold active">
                PayPal Támogatás
            </button>
            <button id="closeModalBtn" class="w-full py-2 rounded-xl text-xs text-[var(--text-muted)] hover:text-white transition-colors">
                Bezárás
            </button>
        </div>
    </div>

    <script>
        /* --- Web Audio API Szintetizátor --- */
        let audioCtx = null;
        let isAudioActive = false;
        // Pentaton akord frekvenciák Hz-ben
        const pentatonicScale = [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSynthTone(freq, duration = 0.4) {
            if (!isAudioActive || !audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                // Finom lecsengési borítógörbe (Envelope)
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.warn("Audio Context Hiba:", e);
            }
        }

        /* --- Visualizer Canvas & Kvantum Geometria --- */
        const canvas = document.getElementById('nexusCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let particles = [];
        const particleCount = 60;
        let globalSpeedMultiplier = 1.5;
        let movementMode = 'stationary'; // 'stationary', 'drift', 'wave', 'chaos'
        let pointer = { x: width / 2, y: height / 2, active: false };
        let time = 0;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            // Álló módban a rácspontok újraelosztása
            if (movementMode === 'stationary') {
                repositionStationaryGrid();
            }
        }

        window.addEventListener('resize', resizeCanvas);

        class QuantumParticle {
            constructor(anchorX, anchorY) {
                this.anchorX = anchorX !== undefined ? anchorX : Math.random() * width;
                this.anchorY = anchorY !== undefined ? anchorY : Math.random() * height;
                this.x = this.anchorX;
                this.y = this.anchorY;
                this.vx = 0;
                this.vy = 0;
                this.baseVx = (Math.random() - 0.5) * 2;
                this.baseVy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * 2.5 + 2;
                this.freq = pentatonicScale[Math.floor(Math.random() * pentatonicScale.length)];
                this.phase = Math.random() * Math.PI * 2;
            }

            update() {
                if (movementMode === 'stationary') {
                    // Stacionárius rugó-fizika (Visszahúzás az alappontra)
                    const dxAnchor = this.anchorX - this.x;
                    const dyAnchor = this.anchorY - this.y;
                    
                    const stiffness = 0.05 * globalSpeedMultiplier;
                    const damping = 0.88;

                    this.vx += dxAnchor * stiffness;
                    this.vy += dyAnchor * stiffness;
                    this.vx *= damping;
                    this.vy *= damping;

                    this.x += this.vx;
                    this.y += this.vy;
                } else if (movementMode === 'drift') {
                    this.x += this.baseVx * globalSpeedMultiplier;
                    this.y += this.baseVy * globalSpeedMultiplier;
                } else if (movementMode === 'wave') {
                    this.x += (this.baseVx + Math.sin(time + this.phase)) * globalSpeedMultiplier;
                    this.y += (this.baseVy + Math.cos(time + this.phase)) * globalSpeedMultiplier;
                } else if (movementMode === 'chaos') {
                    this.x += (this.baseVx + (Math.random() - 0.5) * 3) * globalSpeedMultiplier;
                    this.y += (this.baseVy + (Math.random() - 0.5) * 3) * globalSpeedMultiplier;
                }

                // Keretbe zárás dynamic módoknál
                if (movementMode !== 'stationary') {
                    if (this.x < 0 || this.x > width) this.baseVx *= -1;
                    if (this.y < 0 || this.y > height) this.baseVy *= -1;
                }

                // Egér / Érintés taszítás & Interakció
                if (pointer.active) {
                    const dx = this.x - pointer.x;
                    const dy = this.y - pointer.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = 160;

                    if (dist < maxDist && dist > 0) {
                        const force = (1 - dist / maxDist) * 12 * globalSpeedMultiplier;
                        const nx = dx / dist;
                        const ny = dy / dist;

                        if (movementMode === 'stationary') {
                            this.vx += nx * force;
                            this.vy += ny * force;
                        } else {
                            this.x += nx * force * 0.5;
                            this.y += ny * force * 0.5;
                        }
                    }
                }
            }

            draw() {
                const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-primary').trim();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = primaryColor;
                ctx.fill();
            }
        }

        function repositionStationaryGrid() {
            const cols = Math.ceil(Math.sqrt(particleCount * (width / height)));
            const rows = Math.ceil(particleCount / cols);
            const spacingX = width / (cols + 1);
            const spacingY = height / (rows + 1);

            let idx = 0;
            for (let r = 1; r <= rows; r++) {
                for (let c = 1; c <= cols; c++) {
                    if (idx < particles.length) {
                        particles[idx].anchorX = c * spacingX;
                        particles[idx].anchorY = r * spacingY;
                        idx++;
                    }
                }
            }
        }

        // Részecskék inicializálása
        for (let i = 0; i < particleCount; i++) {
            particles.push(new QuantumParticle());
        }
        repositionStationaryGrid();

        function drawConnections() {
            const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-primary').trim();
            const secondaryColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-secondary').trim();

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxConnectDist = 140;

                    if (dist < maxConnectDist) {
                        const alpha = 1 - (dist / maxConnectDist);
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        
                        // Átmenetes hálózati vonal rajzolása
                        const gradient = ctx.createLinearGradient(particles[i].x, particles[i].y, particles[j].x, particles[j].y);
                        gradient.addColorStop(0, primaryColor);
                        gradient.addColorStop(1, secondaryColor);

                        ctx.globalAlpha = alpha * 0.7;
                        ctx.strokeStyle = gradient;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                        ctx.globalAlpha = 1.0;
                    }
                }
            }
        }

        function renderLoop() {
            ctx.clearRect(0, 0, width, height);
            time += 0.02;

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            drawConnections();
            requestAnimationFrame(renderLoop);
        }

        renderLoop();

        /* --- Interakciós Eseménykezelők --- */
        function handlePointerMove(x, y) {
            pointer.x = x;
            pointer.y = y;
            pointer.active = true;

            // Audio synth hang kibocsátás mozgásra
            if (isAudioActive && Math.random() < 0.07) {
                const randomParticle = particles[Math.floor(Math.random() * particles.length)];
                playSynthTone(randomParticle.freq, 0.35);
            }
        }

        function triggerImpulse(x, y) {
            handlePointerMove(x, y);
            // Kattintásra lökés a közeli pontokon
            particles.forEach(p => {
                const dx = p.x - x;
                const dy = p.y - y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 220 && dist > 0) {
                    const force = (1 - dist / 220) * 25 * globalSpeedMultiplier;
                    p.vx += (dx / dist) * force;
                    p.vy += (dy / dist) * force;
                }
            });
            if (isAudioActive) {
                playSynthTone(pentatonicScale[Math.floor(Math.random() * pentatonicScale.length)], 0.5);
            }
        }

        window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
        window.addEventListener('mousedown', (e) => triggerImpulse(e.clientX, e.clientY));
        window.addEventListener('mouseleave', () => pointer.active = false);

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                triggerImpulse(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });
        window.addEventListener('touchend', () => pointer.active = false);

        /* --- Vezérlő Funkciók --- */

        // 1. Mozgási mód váltó
        window.setMovementMode = function(mode) {
            movementMode = mode;
            document.getElementById('modeStationary').classList.toggle('active', mode === 'stationary');
            document.getElementById('modeDrift').classList.toggle('active', mode === 'drift');
            document.getElementById('modeWave').classList.toggle('active', mode === 'wave');
            document.getElementById('modeChaos').classList.toggle('active', mode === 'chaos');

            if (mode === 'stationary') {
                repositionStationaryGrid();
            }
        };

        // 2. Sebesség Slider
        const speedSlider = document.getElementById('speedSlider');
        const speedValueDisplay = document.getElementById('speedValue');
        speedSlider.addEventListener('input', (e) => {
            globalSpeedMultiplier = parseFloat(e.target.value);
            speedValueDisplay.textContent = globalSpeedMultiplier.toFixed(1) + 'x';
        });

        // 3. UV / Neon Paletta váltó
        window.setUvPalette = function(palette) {
            document.documentElement.setAttribute('data-uv', palette);
        };

        // 4. Jobb alsó sötét/világos téma váltó
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        let currentTheme = 'dark';

        themeToggleBtn.addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            themeIcon.textContent = currentTheme === 'dark' ? '🌙' : '☀️';
        });

        // 5. Audio Synth Be/Ki Váltó
        const audioBtn = document.getElementById('audioToggleBtn');
        const audioIcon = document.getElementById('audioIcon');
        const audioText = document.getElementById('audioText');

        audioBtn.addEventListener('click', () => {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isAudioActive = !isAudioActive;
            audioBtn.classList.toggle('active', isAudioActive);
            audioIcon.textContent = isAudioActive ? '🔊' : '🔇';
            audioText.textContent = isAudioActive ? 'Audio Synth: Be' : 'Audio Synth: Ki';
        });

        // 6. Support Modál
        const supportModal = document.getElementById('supportModal');
        document.getElementById('supportBtn').addEventListener('click', () => {
            supportModal.classList.remove('opacity-0', 'pointer-events-none');
        });
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            supportModal.classList.add('opacity-0', 'pointer-events-none');
        });
    </script>
</body>
</html>
