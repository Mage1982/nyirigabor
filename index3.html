<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHERIA // Generative Cyber Visualizer</title>
    <style>
        :root {
            --bg-color: #08090d;
            --panel-bg: rgba(16, 19, 28, 0.65);
            --panel-border: rgba(0, 240, 255, 0.18);
            --primary: #00f0ff;
            --secondary: #7000ff;
            --accent: #ff0055;
            --text: #e0e8f0;
            --text-dim: #7a8b9e;
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-mono: 'Consolas', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: var(--font-main);
        }

        /* Fullscreen Canvas */
        #viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: crosshair;
        }

        /* Glassmorphism UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            padding: 10px 18px;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 2s infinite;
        }

        .brand-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: var(--font-mono);
            color: #fff;
        }

        .brand-title span {
            color: var(--primary);
        }

        /* Control Panel */
        .control-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            padding: 20px;
            border-radius: 16px;
            width: 320px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .panel-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            font-family: var(--font-mono);
            display: flex;
            justify-content: space-between;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        }

        .btn.active {
            background: var(--primary);
            color: #000;
            font-weight: bold;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -5px;
            box-shadow: 0 0 10px var(--primary);
        }

        /* Footer Info */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 12px;
            color: var(--text-dim);
            font-family: var(--font-mono);
        }

        .instructions {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            padding: 8px 14px;
            border-radius: 8px;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.4; transform: scale(0.9); }
        }

        @media (max-width: 768px) {
            .ui-layer { padding: 12px; }
            .control-panel { width: 100%; max-width: 280px; }
            .instructions { display: none; }
        }
    </style>
</head>
<body>

    <canvas id="viewport"></canvas>

    <div class="ui-layer">
        <header class="interactive">
            <div class="brand">
                <div class="brand-dot"></div>
                <div class="brand-title">Aetheria <span>// Labs</span></div>
            </div>
        </header>

        <main class="interactive" style="align-self: flex-start; margin-top: auto; margin-bottom: 20px;">
            <div class="control-panel">
                <div class="panel-group">
                    <div class="panel-label">
                        <span>Szimulációs Mód</span>
                    </div>
                    <div class="btn-grid">
                        <button class="btn active" onclick="setMode('neural')">Neuronháló</button>
                        <button class="btn" onclick="setMode('quantum')">Kvantumraj</button>
                        <button class="btn" onclick="setMode('matrix')">Mátrix Rács</button>
                        <button class="btn" onclick="setMode('pulse')">Kozmosz</button>
                    </div>
                </div>

                <div class="panel-group">
                    <div class="panel-label">
                        <span>Színpaletta</span>
                    </div>
                    <div class="btn-grid">
                        <button class="btn active" onclick="setPalette('cyan')">Cian Négyzet</button>
                        <button class="btn" onclick="setPalette('neon')">Neo Violet</button>
                        <button class="btn" onclick="setPalette('amber')">Kiber Arany</button>
                        <button class="btn" onclick="setPalette('emerald')">Smaragd</button>
                    </div>
                </div>

                <div class="panel-group">
                    <div class="panel-label">
                        <span>Sűrűség</span>
                        <span id="count-val">100</span>
                    </div>
                    <input type="range" id="particle-count" min="30" max="250" value="100" oninput="updateParticleCount(this.value)">
                </div>

                <div class="panel-group">
                    <div class="panel-label">
                        <span>Audio Szintetizátor</span>
                        <span id="audio-status">Ki</span>
                    </div>
                    <button class="btn" id="audio-btn" onclick="toggleAudio()" style="width: 100%;">Hang Aktiválása</button>
                </div>
            </div>
        </main>

        <footer>
            <div class="instructions">
                Kattints vagy húzd az egeret az interakcióhoz
            </div>
            <div style="font-size: 10px; opacity: 0.6;">
                DESIGNED FOR NYIRIGABOR.HU
            </div>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('viewport');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        });

        // App State
        let currentMode = 'neural';
        let currentPalette = 'cyan';
        let particleCount = 100;
        let particles = [];
        let mouse = { x: width / 2, y: height / 2, active: false, radius: 150 };
        let audioEnabled = false;

        // Color Palettes
        const palettes = {
            cyan: { primary: '#00f0ff', secondary: '#7000ff', bgLines: 'rgba(0, 240, 255, 0.15)' },
            neon: { primary: '#ff007f', secondary: '#7000ff', bgLines: 'rgba(255, 0, 127, 0.15)' },
            amber: { primary: '#ffb700', secondary: '#ff5500', bgLines: 'rgba(255, 183, 0, 0.15)' },
            emerald: { primary: '#00ff66', secondary: '#0088ff', bgLines: 'rgba(0, 255, 102, 0.15)' }
        };

        // Web Audio API Synth Engine
        let audioCtx = null;
        const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // C Pentatonic Scale

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSynthTone(freq) {
            if (!audioEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        function toggleAudio() {
            initAudio();
            audioEnabled = !audioEnabled;
            const btn = document.getElementById('audio-btn');
            const status = document.getElementById('audio-status');
            if (audioEnabled) {
                btn.classList.add('active');
                btn.innerText = "Hang Kikapcsolása";
                status.innerText = "Be";
            } else {
                btn.classList.remove('active');
                btn.innerText = "Hang Aktiválása";
                status.innerText = "Ki";
            }
        }

        // Particle Class
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.radius = Math.random() * 2 + 1;
                this.baseRadius = this.radius;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 0.02 + 0.005;
                this.dist = Math.random() * (width > height ? height : width) * 0.4;
            }

            update() {
                if (currentMode === 'neural' || currentMode === 'matrix') {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                } else if (currentMode === 'quantum') {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 10) {
                        this.vx += (dx / dist) * 0.1;
                        this.vy += (dy / dist) * 0.1;
                    }
                    this.vx *= 0.95;
                    this.vy *= 0.95;
                    this.x += this.vx;
                    this.y += this.vy;
                } else if (currentMode === 'pulse') {
                    this.angle += this.speed;
                    const targetX = width / 2 + Math.cos(this.angle) * this.dist;
                    const targetY = height / 2 + Math.sin(this.angle) * this.dist;
                    this.x += (targetX - this.x) * 0.05;
                    this.y += (targetY - this.y) * 0.05;
                }

                // Mouse interaction distance
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < mouse.radius) {
                    this.radius = this.baseRadius + (1 - dist / mouse.radius) * 4;
                } else {
                    this.radius = this.baseRadius;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = palettes[currentPalette].primary;
                ctx.shadowBlur = 8;
                ctx.shadowColor = palettes[currentPalette].primary;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function renderConnections() {
            const maxDist = 120;
            const activeColor = palettes[currentPalette].bgLines;

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDist) {
                        const alpha = 1 - dist / maxDist;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = activeColor.replace('0.15', (alpha * 0.25).toString());
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(8, 9, 13, 0.25)'; // Smooth trails effect
            ctx.fillRect(0, 0, width, height);

            if (currentMode === 'neural' || currentMode === 'matrix') {
                renderConnections();
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        // Controls Logic
        function setMode(mode) {
            currentMode = mode;
            updateActiveButtons(event.target);
        }

        function setPalette(palette) {
            currentPalette = palette;
            updateActiveButtons(event.target);
            document.documentElement.style.setProperty('--primary', palettes[palette].primary);
            document.documentElement.style.setProperty('--secondary', palettes[palette].secondary);
        }

        function updateParticleCount(val) {
            particleCount = parseInt(val);
            document.getElementById('count-val').innerText = val;
            initParticles();
        }

        function updateActiveButtons(target) {
            const siblings = target.parentElement.children;
            for (let btn of siblings) {
                btn.classList.remove('active');
            }
            target.classList.add('active');
        }

        // Event Listeners
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('click', (e) => {
            // Trigger audio tone based on Y position
            const noteIndex = Math.floor((1 - e.clientY / height) * notes.length);
            playSynthTone(notes[Math.min(notes.length - 1, Math.max(0, noteIndex))]);

            // Shockwave particle boost
            particles.forEach(p => {
                const dx = e.clientX - p.x;
                const dy = e.clientY - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 200) {
                    p.vx -= (dx / dist) * 4;
                    p.vy -= (dy / dist) * 4;
                }
            });
        });

        // Initialize App
        initParticles();
        animate();
    </script>
</body>
</html>
