<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEXUS v3.0 - Quantum Geometry & Sound</title>
    <style>
        :root {
            --bg-color: #080911;
            --accent-pink: #ff0c9d;
            --accent-cyan: #00ffff;
            --glass-bg: rgba(15, 18, 32, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f0f4f8;
            --text-sub: #8a99ad;
        }

        [data-theme="cyberpunk"] {
            --bg-color: #05020a;
            --accent-pink: #f706cf;
            --accent-cyan: #f7d002;
            --glass-bg: rgba(20, 5, 30, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HUD Overlay UI */
        .hud-panel {
            position: absolute;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .hud-header {
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hud-header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hud-controls {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            width: calc(100% - 40px);
            max-width: 480px;
            justify-content: space-around;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:active, .btn.active {
            background: var(--accent-pink);
            color: #fff;
            border-color: var(--accent-pink);
            box-shadow: 0 0 12px var(--accent-pink);
        }

        /* Support Modal */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .modal-card h2 {
            margin-bottom: 12px;
            color: var(--accent-cyan);
        }

        .modal-card p {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .close-btn {
            margin-top: 16px;
            width: 100%;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="nexusCanvas"></canvas>
    </div>

    <!-- HUD Interface -->
    <div class="hud-panel hud-header">
        <h1>NEXUS v3.0</h1>
        <span style="font-size:0.7rem; color: var(--accent-cyan); border:1px solid var(--accent-cyan); padding:2px 6px; border-radius:4px;">QUANTUM AUDIO</span>
    </div>

    <div class="hud-panel hud-controls">
        <button class="btn" id="audioToggleBtn">🔊 Audio: Ki</button>
        <button class="btn" id="themeBtn">🎨 Téma</button>
        <button class="btn" id="supportBtn">☕ Támogatás</button>
    </div>

    <!-- Support Modal -->
    <div class="modal-overlay" id="supportModal">
        <div class="modal-card">
            <h2>NEXUS Támogatás</h2>
            <p>Ha tetszik a projekt és szeretnéd támogatni a további kísérleti audio-vizuális fejlesztéseket, kövesd az alábbi lehetőségeket.</p>
            <button class="btn" style="width:100%; margin-bottom:8px; justify-content:center;" onclick="window.open('https://paypal.me', '_blank')">PayPal Támogatás</button>
            <button class="btn close-btn" id="closeModalBtn">Bezárás</button>
        </div>
    </div>

    <script>
        // --- Web Audio API Szintetizátor ---
        let audioCtx = null;
        let isAudioActive = false;
        const scales = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // Pentaton C-dúr frekvenciák

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playNodeTone(freq, duration = 0.3) {
            if (!isAudioActive || !audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // --- Canvas & Kvantum Geometria Szimuláció ---
        const canvas = document.getElementById('nexusCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const particleCount = 45;
        let pointer = { x: null, y: null, active: false };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.radius = Math.random() * 3 + 2;
                this.freq = scales[Math.floor(Math.random() * scales.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Egér / Érintés interakció
                if (pointer.active) {
                    const dx = pointer.x - this.x;
                    const dy = pointer.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        this.x -= (dx / dist) * 2;
                        this.y -= (dy / dist) * 2;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent-cyan').trim();
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(255, 12, 157, ${1 - dist / 130})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            drawConnections();
            requestAnimationFrame(animate);
        }

        animate();

        // --- Interakciós eseménykezelők (Touch & Mouse) ---
        const handleInputMove = (x, y) => {
            pointer.x = x;
            pointer.y = y;
            pointer.active = true;

            // Hang triggerelés bizonyos távolságonként
            if (Math.random() < 0.05) {
                const randomFreq = scales[Math.floor(Math.random() * scales.length)];
                playNodeTone(randomFreq, 0.2);
            }
        };

        window.addEventListener('mousemove', (e) => handleInputMove(e.clientX, e.clientY));
        window.addEventListener('mouseleave', () => pointer.active = false);

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                handleInputMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('touchend', () => pointer.active = false);

        // --- Gomb események ---
        const audioBtn = document.getElementById('audioToggleBtn');
        audioBtn.addEventListener('click', () => {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isAudioActive = !isAudioActive;
            audioBtn.classList.toggle('active', isAudioActive);
            audioBtn.textContent = isAudioActive ? '🔊 Audio: Be' : '🔇 Audio: Ki';
        });

        const themeBtn = document.getElementById('themeBtn');
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', currentTheme === 'cyberpunk' ? 'default' : 'cyberpunk');
        });

        // Modál kezelés
        const supportModal = document.getElementById('supportModal');
        document.getElementById('supportBtn').addEventListener('click', () => supportModal.classList.add('active'));
        document.getElementById('closeModalBtn').addEventListener('click', () => supportModal.classList.remove('active'));
    </script>
</body>
</html>
