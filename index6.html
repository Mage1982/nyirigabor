<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nyirigabor.hu</title>
  
  <!-- Google Fonts: Oswald (Hosszúkás, modern, minimalista nem talpas betű) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* CSS változók a téma váltáshoz */
    :root {
      --bg-placeholder: #121212;
      --text-placeholder: #ffffff;
      --bg-main: #ffffff;
      --text-main: #000000;
      --btn-bg: #000000;
      --btn-text: #ffffff;
      --btn-border: #000000;
    }

    /* Sötét mód változói */
    [data-theme="dark"] {
      --bg-placeholder: #0a0a0a;
      --text-placeholder: #888888;
      --bg-main: #000000;
      --text-main: #ffffff;
      --btn-bg: #ffffff;
      --btn-text: #000000;
      --btn-border: #ffffff;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      box-sizing: border-box;
      scroll-behavior: smooth;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Rögzített sötét/világos váltó gomb a jobb felső sarokban */
    .theme-toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      padding: 10px 18px;
      font-family: 'Oswald', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1px solid var(--btn-border);
      background-color: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      border-radius: 30px;
      transition: all 0.3s ease;
    }

    .theme-toggle-btn:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }

    /* Kezdő szekció a görgetéshez */
    .hero-placeholder {
      width: 100%;
      height: 100vh;
      background-color: var(--bg-placeholder);
      color: var(--text-placeholder);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Oswald', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Teljes képernyős fő szekció */
    .full-white-section {
      width: 100%;
      height: 100vh;
      background-color: var(--bg-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      transition: background-color 0.3s ease;
    }

    /* Hosszúkás, minimalista címsor */
    .brand-title {
      font-family: 'Oswald', sans-serif;
      font-weight: 300; /* Letisztult, vékonyabb vonalvezetés */
      font-size: clamp(3.5rem, 12vw, 10rem); /* Óriás reszponzív méret */
      color: var(--text-main);
      margin: 0;
      text-align: center;
      text-transform: lowercase; /* Vagy UPPERCASE, ízlés szerint */
      letter-spacing: 4px; /* Nyújtott hatás */
      line-height: 1;
      transition: color 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- Téma váltó gomb -->
  <button class="theme-toggle-btn" id="themeToggle">Sötét mód</button>

  <!-- Első szekció (görgetéshez) -->
  <div class="hero-placeholder">
    <p>Gördíts lejjebb ↓</p>
  </div>

  <!-- Fő szekció az óriás hosszúkás felirattal -->
  <section class="full-white-section">
    <h1 class="brand-title">nyirigabor.hu</h1>
  </section>

  <!-- JavaScript a téma kapcsolásához -->
  <script>
    const toggleBtn = document.getElementById('themeToggle');
    
    toggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      
      if (currentTheme === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        toggleBtn.textContent = 'Sötét mód';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        toggleBtn.textContent = 'Világos mód';
      }
    });
  </script>

</body>
</html>
