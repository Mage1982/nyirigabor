<html lang="hu" data-theme="dark" class="h-full">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#090b10" id="meta-theme-color">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Julia Halmaz | nyirigabor.hu</title>

    <!-- External Resources -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@600;700;800;900&family=Oswald:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        magenta: '#FF0C9D',
                        cyan: '#00FFFF',
                        purpleGlow: '#8A2BE2',
                    },
                    fontFamily: {
                        oswald: ['Oswald', 'sans-serif'],
                        orbitron: ['Orbitron', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* --- HARMONIKUS TÉMA RENDSZER (DARK & LIGHT) --- */
        :root {
            --bg-base: #090b10;
            --bg-overlay: rgba(9, 11, 16, 0.78);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --accent-primary: #00FFFF;
            --accent-secondary: #FF0C9D;
            --card-bg: rgba(13, 18, 28, 0.78);
            --card-bg-hover: rgba(18, 26, 42, 0.92);
            --card-inner: rgba(9, 13, 22, 0.72);
            --card-border: rgba(0, 255, 255, 0.25);
            --card-border-hover: #00FFFF;
            --dock-bg: rgba(10, 14, 23, 0.86);
            --shadow-glow: 0 12px 32px -8px rgba(0, 255, 255, 0.22);
        }

        html[data-theme="light"] {
            --bg-base: #eef2f6;
            --bg-overlay: rgba(241, 245, 249, 0.86);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --accent-primary: #0284c7;
            --accent-secondary: #db2777;
            --card-bg: rgba(255, 255, 255, 0.82);
            --card-bg-hover: rgba(255, 255, 255, 0.96);
            --card-inner: rgba(241, 245, 249, 0.88);
            --card-border: rgba(2, 132, 199, 0.25);
            --card-border-hover: #0284c7;
            --dock-bg: rgba(255, 255, 255, 0.88);
            --shadow-glow: 0 12px 32px -8px rgba(2, 132, 199, 0.18);
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            transition: background-color 0.45s ease, color 0.45s ease;
            min-height: 100dvh;
            overflow: hidden;
            user-select: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1.5px solid var(--card-border);
            box-shadow: var(--shadow-glow);
            transition: border-color 0.28s ease, background-color 0.28s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .app-surface {
            background: var(--dock-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--card-border);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        /* Egyedi csúszkák */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.25);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-primary);
            border: 2px solid var(--bg-base);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-primary);
        }

        .palette-chip.active {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px var(--accent-primary);
            transform: scale(1.03);
        }

        .preset-btn.active {
            border-color: var(--accent-secondary);
            background: rgba(255, 12, 157, 0.16);
            color: var(--text-primary);
        }

        .panel-hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(16px) scale(0.98);
        }

        .pulse-dot {
            box-shadow: 0 0 0 0 rgba(0, 255, 255, 0.7);
            animation: pulseRing 2s infinite;
        }
        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 255, 0.65); }
            70% { box-shadow: 0 0 0 8px rgba(0, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 255, 0); }
        }
    </style>
</head>

    <!-- WEBGL SHADER ÉS INTERAKCIÓS LOGIKA -->
    <script>
        // --- 1. HARMONIKUS TÉMA VÁLTÓ (SZINKRONIZÁLVA A FŐOLDALLAL) ---
        const htmlEl = document.documentElement;
        const themeIcon = document.getElementById('theme-icon');
        const dockThemeIcon = document.getElementById('dock-theme-icon');
        const themeLabel = document.getElementById('theme-label');
        const metaTheme = document.getElementById('meta-theme-color');
        let isLightMode = false;

        function applyTheme(theme) {
            htmlEl.setAttribute('data-theme', theme);
            localStorage.setItem('ng_theme', theme);
            isLightMode = theme === 'light';
            themeIcon.className = isLightMode ? 'fa-solid fa-moon text-sm' : 'fa-solid fa-sun text-sm';
            if (dockThemeIcon) dockThemeIcon.className = isLightMode ? 'fa-solid fa-moon text-base mb-1' : 'fa-solid fa-sun text-base mb-1';
            if (themeLabel) themeLabel.textContent = isLightMode ? 'DARK' : 'LIGHT';
            metaTheme.setAttribute('content', isLightMode ? '#eef2f6' : '#090b10');
            needsRender = true;
        }

        function toggleTheme() {
            const current = htmlEl.getAttribute('data-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        applyTheme(localStorage.getItem('ng_theme') || 'dark');

        // --- 2. VEZÉRLŐPANEL KAPCSOLÓ ---
        const controlPanel = document.getElementById('control-panel');
        function togglePanel() {
            controlPanel.classList.toggle('panel-hidden');
        }

        // --- 3. WEBGL JULIA HALMAZ RENDERER ---
        const canvas = document.getElementById('julia-canvas');
        const gl = canvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: false });

        const vsSource = `
            attribute vec2 a_pos;
            void main() {
                gl_Position = vec4(a_pos, 0.0, 1.0);
            }
        `;

        const fsSource = `
            precision highp float;
            uniform vec2 u_res;
            uniform vec2 u_center;
            uniform float u_zoom;
            uniform vec2 u_c;
            uniform int u_maxIter;
            uniform int u_palette;
            uniform float u_isLight;

            vec3 getPalette(float t, int pal) {
                t = fract(t);
                if (pal == 0) {
                    // Cyber Neon (Cyan -> Purple -> Magenta)
                    vec3 a = vec3(0.05, 0.12, 0.22);
                    vec3 b = vec3(0.45, 0.45, 0.55);
                    vec3 c = vec3(1.0, 1.0, 1.0);
                    vec3 d = vec3(0.50, 0.15, 0.85);
                    return a + b * cos(6.28318 * (c * t + d));
                } else if (pal == 1) {
                    // Kvantum Ibolya
                    vec3 a = vec3(0.18, 0.08, 0.35);
                    vec3 b = vec3(0.45, 0.42, 0.55);
                    vec3 c = vec3(1.0, 1.0, 1.0);
                    vec3 d = vec3(0.65, 0.35, 0.10);
                    return a + b * cos(6.28318 * (c * t + d));
                } else if (pal == 2) {
                    // Napkitörés (Solar Gold & Orange)
                    vec3 a = vec3(0.45, 0.18, 0.05);
                    vec3 b = vec3(0.52, 0.42, 0.25);
                    vec3 c = vec3(1.0, 1.0, 0.8);
                    vec3 d = vec3(0.00, 0.12, 0.35);
                    return a + b * cos(6.28318 * (c * t + d));
                } else if (pal == 3) {
                    // Mélytengeri Aura (Emerald & Aqua)
                    vec3 a = vec3(0.04, 0.32, 0.38);
                    vec3 b = vec3(0.25, 0.55, 0.50);
                    vec3 c = vec3(1.0, 1.0, 1.0);
                    vec3 d = vec3(0.30, 0.10, 0.20);
                    return a + b * cos(6.28318 * (c * t + d));
                } else {
                    // Kozmikus Mátrix (Monokróm + Magenta él)
                    float v = 0.5 + 0.5 * cos(6.28318 * t);
                    return mix(vec3(0.06, 0.08, 0.14), vec3(0.95, 0.96, 1.0), v) + vec3(0.35, 0.0, 0.22) * pow(v, 4.0);
                }
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
                vec2 z = u_center + uv * (2.6 / u_zoom);

                float iter = 0.0;
                float escaped = 0.0;

                for (int i = 0; i < 600; i++) {
                    if (i >= u_maxIter) break;
                    float x = (z.x * z.x - z.y * z.y) + u_c.x;
                    float y = (2.0 * z.x * z.y) + u_c.y;
                    z = vec2(x, y);
                    if (dot(z, z) > 16.0) {
                        escaped = 1.0;
                        break;
                    }
                    iter += 1.0;
                }

                if (escaped < 0.5) {
                    vec3 coreColor = u_isLight > 0.5 ? vec3(0.92, 0.95, 0.98) : vec3(0.035, 0.043, 0.063);
                    gl_FragColor = vec4(coreColor, 1.0);
                } else {
                    float smoothIter = iter - log2(log2(dot(z, z))) + 4.0;
                    vec3 col = getPalette(smoothIter * 0.022, u_palette);
                    if (u_isLight > 0.5) {
                        col = mix(col, vec3(1.0), 0.12);
                    }
                    gl_FragColor = vec4(col, 1.0);
                }
            }
        `;

        function compileShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const program = gl.createProgram();
        gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

        const aPos = gl.getAttribLocation(program, 'a_pos');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        const uRes = gl.getUniformLocation(program, 'u_res');
        const uCenter = gl.getUniformLocation(program, 'u_center');
        const uZoom = gl.getUniformLocation(program, 'u_zoom');
        const uC = gl.getUniformLocation(program, 'u_c');
        const uMaxIter = gl.getUniformLocation(program, 'u_maxIter');
        const uPalette = gl.getUniformLocation(program, 'u_palette');
        const uIsLight = gl.getUniformLocation(program, 'u_isLight');

        // Állapot változók
        let state = {
            centerX: 0.0,
            centerY: 0.0,
            zoom: 1.0,
            cRe: -0.7269,
            cIm: 0.1889,
            maxIter: 220,
            palette: 0
        };

        let isMorphing = false;
        let morphAngle = 0;
        let needsRender = true;

        const creSlider = document.getElementById('cre-slider');
        const cimSlider = document.getElementById('cim-slider');
        const iterSlider = document.getElementById('iter-slider');
        const creVal = document.getElementById('cre-val');
        const cimVal = document.getElementById('cim-val');
        const iterVal = document.getElementById('iter-val');
        const zoomReadout = document.getElementById('zoom-readout');

        function updateUIReadouts() {
            creSlider.value = state.cRe;
            cimSlider.value = state.cIm;
            creVal.textContent = state.cRe.toFixed(4);
            cimVal.textContent = state.cIm.toFixed(4);
            iterVal.textContent = state.maxIter;
            zoomReadout.textContent = state.zoom >= 1000
                ? state.zoom.toExponential(1) + 'x'
                : state.zoom.toFixed(1) + 'x';
        }

        function setPalette(idx, name, btnEl) {
            state.palette = idx;
            document.getElementById('palette-name').textContent = name;
            document.querySelectorAll('.palette-chip').forEach(c => c.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            needsRender = true;
        }

        function applyPreset(re, im, btnEl) {
            isMorphing = false;
            updateMorphBtn();
            state.cRe = re;
            state.cIm = im;
            state.centerX = 0.0;
            state.centerY = 0.0;
            state.zoom = 1.0;
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            updateUIReadouts();
            needsRender = true;
        }

        function resetView() {
            state.centerX = 0.0;
            state.centerY = 0.0;
            state.zoom = 1.0;
            updateUIReadouts();
            needsRender = true;
        }

        function toggleMorph() {
            isMorphing = !isMorphing;
            updateMorphBtn();
            needsRender = true;
        }

        function updateMorphBtn() {
            const btn = document.getElementById('morph-btn');
            btn.innerHTML = isMorphing
                ? '<i class="fa-solid fa-pause mr-1"></i>Stop'
                : '<i class="fa-solid fa-play mr-1"></i>Morf';
        }

        creSlider.addEventListener('input', (e) => {
            isMorphing = false;
            updateMorphBtn();
            state.cRe = parseFloat(e.target.value);
            updateUIReadouts();
            needsRender = true;
        });

        cimSlider.addEventListener('input', (e) => {
            isMorphing = false;
            updateMorphBtn();
            state.cIm = parseFloat(e.target.value);
            updateUIReadouts();
            needsRender = true;
        });

        iterSlider.addEventListener('input', (e) => {
            state.maxIter = parseInt(e.target.value, 10);
            updateUIReadouts();
            needsRender = true;
        });

        // --- EGÉR ÉS ÉRINTÉS ZOOM / MOZGATÁS ---
        let isDragging = false;
        let lastX = 0, lastY = 0;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const scale = 2.6 / (Math.min(canvas.width, canvas.height) * state.zoom);
            state.centerX -= (e.clientX - lastX) * scale * (window.devicePixelRatio || 1);
            state.centerY += (e.clientY - lastY) * scale * (window.devicePixelRatio || 1);
            lastX = e.clientX;
            lastY = e.clientY;
            needsRender = true;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.18 : 0.85;
            state.zoom = Math.max(0.4, Math.min(state.zoom * factor, 250000));
            updateUIReadouts();
            needsRender = true;
        }, { passive: false });

        // Touch támogatás (1 ujj: mozgatás, 2 ujj: csippentéses zoom)
        let lastPinchDist = 0;
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                lastPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const dpr = window.devicePixelRatio || 1;
            if (e.touches.length === 1 && isDragging) {
                const scale = 2.6 / (Math.min(canvas.width, canvas.height) * state.zoom);
                state.centerX -= (e.touches[0].clientX - lastX) * scale * dpr;
                state.centerY += (e.touches[0].clientY - lastY) * scale * dpr;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                needsRender = true;
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                if (lastPinchDist > 0) {
                    state.zoom = Math.max(0.4, Math.min(state.zoom * (dist / lastPinchDist), 250000));
                    updateUIReadouts();
                    needsRender = true;
                }
                lastPinchDist = dist;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
            lastPinchDist = 0;
        });

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(window.innerWidth * dpr);
            canvas.height = Math.floor(window.innerHeight * dpr);
            gl.viewport(0, 0, canvas.width, canvas.height);
            needsRender = true;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderLoop() {
            if (isMorphing) {
                morphAngle += 0.008;
                state.cRe = 0.7885 * Math.cos(morphAngle);
                state.cIm = 0.7885 * Math.sin(morphAngle);
                updateUIReadouts();
                needsRender = true;
            }

            if (needsRender) {
                gl.uniform2f(uRes, canvas.width, canvas.height);
                gl.uniform2f(uCenter, state.centerX, state.centerY);
                gl.uniform1f(uZoom, state.zoom);
                gl.uniform2f(uC, state.cRe, state.cIm);
                gl.uniform1i(uMaxIter, state.maxIter);
                gl.uniform1i(uPalette, state.palette);
                gl.uniform1f(uIsLight, isLightMode ? 1.0 : 0.0);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                needsRender = false;
            }

            requestAnimationFrame(renderLoop);
        }

        updateUIReadouts();
        renderLoop();
    </script>
</body>
</html>
